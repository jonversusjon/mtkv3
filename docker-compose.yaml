# Default stack: builds the image (including the fresh Vite bundle) and serves
# the built frontend from Flask. No source bind mounts, so the bundle baked
# into the image is what is served. For live-reload development use
# docker-compose.dev.yaml.
x-app-env: &app-env
  PYTHONPATH: /app
  FLASK_ENV: production
  CELERY_BROKER_URL: redis://redis:6379/0
  CELERY_RESULT_BACKEND: redis://redis:6379/0
  REDIS_URL: redis://redis:6379/0
  REDIS_HOST: redis

services:
  backend:
    build:
      context: .
      dockerfile: flask_backend/Dockerfile
    working_dir: /app
    command: ["flask", "--app", "flask_backend.app:create_app", "run", "--host=0.0.0.0", "--port=5000"]
    environment: *app-env
    ports:
      - "5000:5000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: flask_backend/Dockerfile
    working_dir: /app
    command: ["celery", "-A", "flask_backend.celery_worker.celery", "worker", "--loglevel=info"]
    environment: *app-env
    depends_on:
      - redis

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
