services:
  backend:
    build:
      context: .
      dockerfile: flask_backend/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - ./flask_backend/log_utils/logs:/app/flask_backend/log_utils/logs
    command: flask --app flask_backend.app:create_app run --host=0.0.0.0 --debug --reload
    environment:
      PYTHONPATH: /app
      FLASK_APP: flask_backend.app:create_app()
      FLASK_ENV: development
      FLASK_DEBUG: "1"
      FLASK_TESTING: "true"
      PREFILL_DATA: flask_backend.dev.prefill_data.dev_defaults
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
      REDIS_HOST: redis
    ports:
      - "5000:5000"
    depends_on:
      - redis

  worker:
    build:
      context: .
      dockerfile: flask_backend/Dockerfile
    working_dir: /app
    volumes:
      - .:/app
      - ./flask_backend/log_utils/logs:/app/flask_backend/log_utils/logs
    command: >
      /bin/sh -c "python -c 'import os, importlib; cfg = os.getenv(\"PREFILL_DATA\"); importlib.import_module(cfg) if cfg else None' &&
      watchmedo auto-restart --directory=/app --pattern=*.py --recursive -- 
      celery -A flask_backend.celery_worker.celery worker 
      --concurrency=4 --loglevel=INFO --logfile=/app/flask_backend/log_utils/logs/celery_worker.log"
    environment:
      PYTHONPATH: /app
      FLASK_ENV: development
      FLASK_TESTING: "true"
      PREFILL_DATA: flask_backend.dev.prefill_data.dev_defaults
      CELERY_BROKER_URL: redis://redis:6379/0
      CELERY_RESULT_BACKEND: redis://redis:6379/0
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis

  # Development entry point for the UI: Vite dev server with HMR, proxying
  # /api and /sse to the backend service. Open http://localhost:3000.
  frontend:
    image: node:22-alpine
    working_dir: /app/react-frontend
    volumes:
      - ./react-frontend:/app/react-frontend
      - frontend_node_modules:/app/react-frontend/node_modules
    command: sh -c "npm ci --no-audit --no-fund && npm run dev"
    environment:
      VITE_HOST: 0.0.0.0
      VITE_PROXY_TARGET: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

volumes:
  frontend_node_modules:
